name: Publish Windows release
on:
  push:
    paths: ['VERSION']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Invalid version' }
          $actual = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path FortnitePreset-Star.exe)).Version.ToString()
          if ($actual -ne $version) { throw 'Executable version mismatch' }
          gh release create "v$version" FortnitePreset-Star.exe --target $env:GITHUB_SHA --title "Fortnite Preset $version" --generate-notes
          exit $LASTEXITCODE
      - name: Verify startup upgrade from first release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = New-Item -Type Directory (Join-Path $env:RUNNER_TEMP 'Preset upgrade test')
          gh release download v1.0.0.0 --pattern FortnitePreset-Star.exe --dir $dir
          if ($LASTEXITCODE) { throw 'Baseline download failed' }
          $exe = Join-Path $dir 'FortnitePreset-Star.exe'
          $expected = (Get-FileHash .\FortnitePreset-Star.exe).Hash
          if ((Get-FileHash $exe).Hash -eq $expected) { throw 'Expected an older baseline' }
          Start-Process -FilePath $exe -WindowStyle Hidden
          $until = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Milliseconds 500
            $updated = (Get-FileHash $exe).Hash -eq $expected
            $title = 'Fortnite Preset ' + (Get-Content VERSION -Raw).Trim()
            $window = Get-Process -Name FortnitePreset-Star -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe -and $_.MainWindowTitle -eq $title }
          } until (($updated -and $window) -or (Get-Date) -gt $until)
          if (!$updated) { throw 'Startup did not replace the baseline with this release' }
          if (!$window) { throw 'Updated window did not reopen' }
          $window.CloseMainWindow() | Out-Null
