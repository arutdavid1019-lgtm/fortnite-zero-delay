name: Publish Windows release
on:
  push:
    paths: ['VERSION']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Invalid version' }
          $actual = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path FortnitePreset-Star.exe)).Version.ToString()
          if ($actual -ne $version) { throw 'Executable version mismatch' }
          gh release create "v$version" FortnitePreset-Star.exe --target $env:GITHUB_SHA --title "Fortnite Preset $version" --generate-notes
          exit $LASTEXITCODE
