name: Publish Windows release
on:
  push:
    paths: ['VERSION']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Invalid version' }
          $source = 'using System.Reflection; [assembly:AssemblyVersion("' + $version + '")] internal static class ReleaseInfo { internal const string Repository="' + $env:GITHUB_REPOSITORY + '"; }'
          Set-Content ReleaseInfo.cs $source -Encoding ascii
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /target:winexe /r:System.Web.Extensions.dll /win32icon:star.ico /resource:star.ico,FortnitePreset.Star.ico /out:FortnitePreset-Star.exe Window.cs Native.cs Updater.cs ReleaseInfo.cs
          if ($LASTEXITCODE) { throw 'Compilation failed' }
          gh release create "v$version" FortnitePreset-Star.exe --target $env:GITHUB_SHA --title "Fortnite Preset $version" --generate-notes
          exit $LASTEXITCODE
